
version: 2

sources:
  - name: raw
    schema: gz_raw_data
    description: dataset with raw datas
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: orders and products for each day of sale
        # Freshness testing
        loaded_at_field: "CAST(date_date AS TIMESTAMP)"
        freshness:
           warn_after:
            count: 90
            period: day
        columns:
          - name: date_date
            description: date of purchase
          - name: orders_id
          - name: products_id
          - name: revenue
            description: revenue generated by this particular product in this particular order
          - name: quantity
            description: number of this particular product sold in this particular order
        tests:
          - unique:
              column_name: "(orders_id || '-' || pdt_id)"
              
      - name: product
        identifier: raw_gz_product
        description: pricing of all products
        columns:
          - name: products_id
            description: primary key
            tests:
              - unique
              - not_null
          - name: purchase_price
            description: price of this product
      - name: ship
        identifier: raw_gz_ship
        description: shipping fees and operational costs of all orders
        columns:
          - name: orders_id
            description: primary key
            tests:
              - unique
              - not_null
          - name: shipping_fee
            description: fee payed by the customer for this order
          - name: logcost
            description: logistic cost for this order
          - name: ship_cost
            description: shipping cost for this order
    